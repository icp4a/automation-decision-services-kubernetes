      This file is a sample of a resource file for Automation Decision Services (ADS)
      where all parameters are exposed with their default value.
      It is not intended for direct use, but for extensive documentation of the parameters.

      WARNING: For real installations, it is advised to start with the 'minimal' CR samples and 
      add only the parameters required for the use case.
      This will ease maintenance and upgrade to newer versions of ADS.

---
apiVersion: ads.ibm.com/v1
kind: AutomationDecisionService
metadata:
  # Name of this ADS instance.
  # The name of some resources listed below, or automatically generated by the operator, are prefixed by this name.
  name: "sample"

spec:
  # Required: if this value is not "26.0.0" the operator ignores this resource.
  version: "26.0.0"

  # Global PDB enable/disable - applies to all services by default
  # enable_pdb: false  # PDB disabled by default - uncomment and set to true to enable PDB for all services

  license:
    # Required: used to accept license, the only valid value only is the boolean true.
    # License information: http://www14.software.ibm.com/cgi-bin/weblap/lap.pl?li_formnum=L-ASAY-CHVJG8
    accept:

  # You can specify a profile size for Automation Decision Services - valid values are small,medium,large,extra-large.
  # The default is small.
  # This value affects the default resource requests and limits of ADS services.
  # Example resources in this file are reflecting small profile ones.
  deployment_profile_size: "small"

  # List of image pull secrets for download of container images of Automation Decision Services
  image_pull_secrets:
    - "ibm-entitlement-key"

  # Setting for secure computing mode (seccomp) profile for Automation Decision Services containers.
  # By default, no seccomp profile is set on the ADS containers, except when installing on OpenShift
  # Container Platform (OCP) and Red Hat OpenShift Kubernetes Service (ROKS) version 4.11 and later
  # where a "RuntimeDefault" profile is automatically set.
  # For more information on seccomp please refer to https://kubernetes.io/docs/tutorials/security/seccomp/ and
  # https://docs.openshift.com/container-platform/4.12/security/seccomp-profiles.html
  # NOTE: Defining a custom, localhost seccomp profile that is stricter than the default RuntimeDefault profile
  # may cause ADS pods fail to start.  This custom profile should be created at the worker nodes.
  #seccomp_profile:
  #  type: "RuntimeDefault" # or "Localhost", "Unconfined"
  #  # Local path of custom seccomp profile when type `Localhost` is used. The custom profile must be accessible by
  #  # the pod and must exist locally on all worker nodes.  For example: `/profiles/fine-grained.json`.
  #  # localhost_profile: ""

  # Default storage class name used for Zen.
  # Can be overridden in specific sections, such as spec.zen.block_storage_classname.
  # Not setting this storage_class_name (or setting it to null) means that the default storage class of the Kubernetes cluster is used.
  # Modifying this parameter after the initial installation has not effect.
  storage_classname: null

  # List of secrets containing TLS CA certificates that must be trusted by Automation Decision Services
  # in addition to the system Root Certificate Authorities.
  # Each listed secret must contain a "tls.crt" key with a PEM-encoded certificate.
  trusted_certificate_list: []

  # Set the runAsUser parameter of the security context of the pods of Automation Decision Services.
  # On OpenShift Container Platform (OCP) and Red Hat OpenShift Kubernetes Service (ROKS), this parameter has no effect and no runAsUser parameter is set on pods.
  # On other Kubernetes clusters, the default value is 50001, except for the embedded MongoDB instance (see below).
  #run_as_user: 50001

  # WARNING: For 26.0.0 GA, foundational services must be configured to use an external PostgreSQL database.
  # For more information, see: https://www.ibm.com/docs/en/cloud-paks/foundational-services/4.x_cd?topic=installer-preparing-install-foundational-services#data

  # These parameters configure the installation of the Zen instance that is triggered by this ADS instance.
  zen:
    # Set the storage class for persistent volumes backed by a block device as needed by Zen.
    # By default, use the spec.zen.file_storage_classname or spec.storage_classname value, but either
    # one or the other must be set to a non null value.
    # Modifying this parameter after the initial installation has not effect.
    #block_storage_classname: ""

    # Set the profile size of Zen.
    # Possible values are starterset, small, medium, large and xlarge.
    # By default, with the small profile for ADS, Zen is instanciated with the starterset scale config
    scale_config: "starterset"

  decision_designer:
    # Controls whether Decision Designer is deployed or not.
    enabled: false

    database:
      # A flag to control whether to use the embedded PostgreSQL database or not.
      # WARNING: For 26.0.0 GA, set this value to 'false' because embedded PostgreSQL is not supported.
      # When it is set to true, a dedicated PostgreSQL server is automatically installed, and Decision Designer is configured to use it.
      embedded: false 

      # The name of the schema in the database for Decision Designer.
      current_schema: ads

      # Hostname of the remote PostgreSQL server. 
      # Required if database.use_embedded is false.
      hostname: 

      # The name of the database for Decision Designer in the PostgreSQL server. 
      name: adsdesigner

      # TCP port number of the remote PostgreSQL server.
      port: 5432

      # The name of the secret with credentials for roles to connect to the PostgreSQL database.
      secret_name: "sample-ads-designer-database"

      # The level of TLS protection when Decision Designer is connecting to the remote PostgreSQL server. 
      # Valid modes are disable, allow, prefer, require, verify-ca and verify-full. These modes are defined in https://www.postgresql.org/docs/current/libpq-ssl.html 
      ssl_mode: verify-full

    # The name of the secret that contains all the Decision Designer sensitive data, like encryption key for
    # sensitive data.
    admin_secret_name: "sample-ads-designer-secret"

    # You can specify a profile size for ADS Designer if different from the rest of ADS.
    # valid values are small,medium,large - default is small.
    # Resources in this file are reflecting small profile ones.
    #deployment_profile_size: "small"

    # Config maps containing certificates to trust for specific usage in addition to the certificates from
    # spec.trusted_certificate_list above.
    # A single name of config map can be specified for each parameter, but each entry with a key name that ends
    # with .crt will be included.
    #git_servers_certs:
    #ml_providers_certs:
    #other_trusted_certs:

    # Optional set of custom labels to set on pods of all components of Decision Designer.
    # Label names and values must be strings, not prefixed with "kubernetes.io/" or "ads.ibm.com/"
    labels: {}

    # Configure the 'rest api' service of Automation Decision Services
    rest_api:
      # Number of replica for the service.  Default is one with the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      replica_count: 1
      # This sample shows the default values for the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      resources:
        requests:
          cpu: '500m'
          memory: '800Mi'
          ephemeral_storage: '100Mi'
        limits:
          cpu: '1000m'
          memory: '1.5Gi'
          ephemeral_storage: '1200Mi'

      liveness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 18  # Wait 3 minutes (18 × 10s) before restarting
        timeoutSeconds: 7
      startup_probe:
        initialDelaySeconds: 50
        periodSeconds: 10
        failureThreshold: 15  # Max startup time: 200s (50s + 15×10s), actual ~72s
        timeoutSeconds: 7
      readiness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 6  # Remove from service after 60s (6×10s) of failures
        timeoutSeconds: 7
      # Optional set of custom labels to set on pods of this service.
      # Label names and values must be strings, not prefixed with "kubernetes.io/" or "ads.ibm.com/".
      # This set augments the set of custom labels defined at the decision_designer level.
      labels: {}
      # Pod Disruption Budget configuration for REST API service
      pod_disruption_budget:
        # enabled: false  # Defaults to global enable_pdb value - uncomment to override for this service only
        minAvailable: 0  # Set to 0 for small profile (1 replica) to allow pod disruption during maintenance. Set to 1 when replicas >= 2
        unhealthyPodEvictionPolicy: AlwaysAllow
      # Define the pod deployment strategy using the same syntax as in Kubernetes Deployment resource
      # (cf. https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/deployment-v1/#DeploymentSpec)
      strategy:
        type: rollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

    # Configure the 'credentials' service of Automation Decision Services
    credentials_service:
      # Number of replica for the service.  Default is one with the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      replica_count: 1
      # This sample shows the default values for the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      resources:
        requests:
          cpu: '250m'
          memory: '800Mi'
          ephemeral_storage: '100Mi'
        limits:
          cpu: '1000m'
          memory: '1.5Gi'
          ephemeral_storage: '400Mi'

      liveness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 18  # Wait 3 minutes (18 × 10s) before restarting
        timeoutSeconds: 7
      startup_probe:
        initialDelaySeconds: 50
        periodSeconds: 10
        failureThreshold: 12  # Max startup time: 170s (50s + 12×10s), actual ~62s
        timeoutSeconds: 7
      readiness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 6  # Remove from service after 60s (6×10s) of failures
        timeoutSeconds: 7
      # Optional set of custom labels to set on pods of this service.
      # Label names and values must be strings, not prefixed with "kubernetes.io/" or "ads.ibm.com/".
      # This set augments the set of custom labels defined at the decision_designer level.
      labels: {}
      # Pod Disruption Budget configuration for Credentials service
      pod_disruption_budget:
        # enabled: false  # Defaults to global enable_pdb value - uncomment to override for this service only
        minAvailable: 0  # Set to 0 for small profile (1 replica) to allow pod disruption during maintenance. Set to 1 when replicas >= 2
        unhealthyPodEvictionPolicy: AlwaysAllow
      # Define the pod deployment strategy using the same syntax as in Kubernetes Deployment resource
      # (cf. https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/deployment-v1/#DeploymentSpec)
      strategy:
        type: rollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

    # Configure the git service of Automation Decision Services
    git_service:
      # Number of replica for the service.  Default is one with the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      replica_count: 1
      # This sample shows the default values for the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      resources:
        requests:
          cpu: '500m'
          memory: '800Mi'
          ephemeral_storage: '100Mi'
        limits:
          cpu: '1000m'
          memory: '1.5Gi'
          ephemeral_storage: '400Mi'

      liveness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 18  # Wait 3 minutes (18 × 10s) before restarting
        timeoutSeconds: 7
      startup_probe:
        initialDelaySeconds: 50
        periodSeconds: 10
        failureThreshold: 12  # Max startup time: 170s (50s + 12×10s), actual ~62s
        timeoutSeconds: 7
      readiness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 6  # Remove from service after 60s (6×10s) of failures
        timeoutSeconds: 7
      # Optional set of custom labels to set on pods of this service.
      # Label names and values must be strings, not prefixed with "kubernetes.io/" or "ads.ibm.com/".
      # This set augments the set of custom labels defined at the decision_designer level.
      labels: {}

      # Max upload file size in bytes for upload in designer.
      # Default value is 67108864 (64MB)
      max_upload_file_size: 67108864
      # Pod Disruption Budget configuration for Git service
      pod_disruption_budget:
        # enabled: false  # Defaults to global enable_pdb value - uncomment to override for this service only
        minAvailable: 0  # Set to 0 for small profile (1 replica) to allow pod disruption during maintenance. Set to 1 when replicas >= 2
        unhealthyPodEvictionPolicy: AlwaysAllow
      # Define the pod deployment strategy using the same syntax as in Kubernetes Deployment resource
      # (cf. https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/deployment-v1/#DeploymentSpec)
      strategy:
        type: rollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

    # Configure the parsing service of Automation Decision Services
    parsing_service:
      # Number of replica for the service.  Default is one with the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      replica_count: 1
      # This sample shows the default values for the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      resources:
        requests:
          cpu: '250m'
          memory: '800Mi'
          ephemeral_storage: '100Mi'
        limits:
          cpu: '1000m'
          memory: '1.5Gi'
          ephemeral_storage: '700Mi'

      liveness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 18  # Wait 3 minutes (18 × 10s) before restarting
        timeoutSeconds: 7
      startup_probe:
        initialDelaySeconds: 50
        periodSeconds: 10
        failureThreshold: 15  # Max startup time: 200s (50s + 15×10s), actual ~71s
        timeoutSeconds: 7
      readiness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 6  # Remove from service after 60s (6×10s) of failures
        timeoutSeconds: 7
      # Optional set of custom labels to set on pods of this service.
      # Label names and values must be strings, not prefixed with "kubernetes.io/" or "ads.ibm.com/".
      # This set augments the set of custom labels defined at the decision_designer level.
      labels: {}

      # The Horizontal Pod Autoscaling (HPA) of this service is enabled by default only when
      # the deployment profile is set to "extra-large".
      autoscaling:
        # Allows to force status of the HPA independently of the deployment profile.
        #enabled: false
        max_replicas: 2
        min_replicas: 5
        # Default implementation: Target 80% of limit as % of request = 320%
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 320
        # Conservative behavior: slow scale down, moderate scale up
        # behavior:
        #   scaleDown:
        #     stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
        #     policies:
        #       - type: Percent
        #         value: 50  # Max 50% of current pods
        #         periodSeconds: 60
        #       - type: Pods
        #         value: 2  # Or max 2 pods
        #         periodSeconds: 60
        #     selectPolicy: Min  # Choose the most conservative
        #   scaleUp:
        #     stabilizationWindowSeconds: 60  # Wait 1 minute to stabilize
        #     policies:
        #       - type: Percent
        #         value: 100  # Max double the pods
        #         periodSeconds: 30
        #       - type: Pods
        #         value: 4  # Or max 4 pods
        #         periodSeconds: 30
        #     selectPolicy: Max  # Choose the most aggressive
      
      # Pod Disruption Budget configuration for Parsing service
      pod_disruption_budget:
        # enabled: false  # Defaults to global enable_pdb value - uncomment to override for this service only
        minAvailable: 0  # Set to 0 for small profile (1 replica) to allow pod disruption during maintenance. Set to 1 when replicas >= 2
        unhealthyPodEvictionPolicy: AlwaysAllow
      # Define the pod deployment strategy using the same syntax as in Kubernetes Deployment resource
      # (cf. https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/deployment-v1/#DeploymentSpec)
      strategy:
        type: rollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

    # Configure the run service of Automation Decision Services
    run_service:
      # Number of replica for the service.  Default is one with the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      replica_count: 1
      # This sample shows the default values for the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      resources:
        requests:
          cpu: '500m'
          memory: '800Mi'
          ephemeral_storage: '100Mi'
        limits:
          cpu: '1000m'
          memory: '1.5Gi'
          ephemeral_storage: '700Mi'

      liveness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 18  # Wait 3 minutes (18 × 10s) before restarting - important for long-running requests
        timeoutSeconds: 7
      startup_probe:
        initialDelaySeconds: 90
        periodSeconds: 10
        failureThreshold: 15  # Max startup time: 240s (90s + 15×10s), actual ~131s - slowest service
        timeoutSeconds: 7
      readiness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 6  # Remove from service after 60s (6×10s) of failures
        timeoutSeconds: 7
      # Optional set of custom labels to set on pods of this service.
      # Label names and values must be strings, not prefixed with "kubernetes.io/" or "ads.ibm.com/".
      # This set augments the set of custom labels defined at the decision_designer level.
      labels: {}

      # The Horizontal Pod Autoscaling (HPA) of this service is enabled by default only when
      # the deployment profile is set to "extra-large".
      autoscaling:
        # Allows to force status of the HPA independently of the deployment profile.
        #enabled: false
        max_replicas: 2
        min_replicas: 5
        # Default metrics: Target 80% of limit as % of request = 160%
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 160
        # # Balanced behavior: moderate scale down and up
        # behavior:
        #   scaleDown:
        #     stabilizationWindowSeconds: 180  # Wait 3 minutes
        #     policies:
        #       - type: Pods
        #         value: 1  # Remove 1 pod at a time
        #         periodSeconds: 60
        #     selectPolicy: Min
        #   scaleUp:
        #     stabilizationWindowSeconds: 30  # Quick response
        #     policies:
        #       - type: Percent
        #         value: 50  # Max 50% increase
        #         periodSeconds: 60
        #       - type: Pods
        #         value: 2  # Or max 2 pods
        #         periodSeconds: 60
        #     selectPolicy: Max

      # Pod Disruption Budget configuration for Run service
      pod_disruption_budget:
        # enabled: false  # Defaults to global enable_pdb value - uncomment to override for this service only
        minAvailable: 0  # Set to 0 for small profile (1 replica) to allow pod disruption during maintenance. Set to 1 when replicas >= 2
        unhealthyPodEvictionPolicy: AlwaysAllow
      # Define the pod deployment strategy using the same syntax as in Kubernetes Deployment resource
      # (cf. https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/deployment-v1/#DeploymentSpec)
      strategy:
        type: rollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

  decision_runtime:
    # Controls whether the Decision runtime is deployed or not.
    enabled: false

    database:
      # A flag to control whether to use the embedded PostgreSQL database or not.
      # WARNING: For 26.0.0 GA, set this value to 'false' because embedded PostgreSQL is not supported.
      # When it is set to true, a dedicated PostgreSQL server is automatically installed, and Decision Runtime is configured to use it.
      embedded: false 

      # The name of the schema in the database for Decision Runtime.
      current_schema: ads

      # Hostname of the remote PostgreSQL server. 
      # Required if database.use_embedded is false.
      hostname: 

      # The name of the database for Decision Runtime in the PostgreSQL server. 
      name: adsruntime

      # TCP port number of the remote PostgreSQL server.
      port: 5432

      # The name of the secret with credentials for roles to connect to the PostgreSQL database.
      secret_name: "sample-ads-runtime-database"

      # The level of TLS protection when Decision Runtime is connecting to the remote PostgreSQL server. 
      # Valid modes are disable, allow, prefer, require, verify-ca and verify-full. These modes are defined in https://www.postgresql.org/docs/current/libpq-ssl.html 
      ssl_mode: verify-full

    # The name of the secret that contains all the Decision runtime sensitive data, like encryption key for sensitive data
    # and the credentials for specific management accounts.
    admin_secret_name: "sample-ads-runtime-secret"

    # You can specify a profile size for the ADS runtime if different from the rest of ADS.
    # Valid values are small,medium,large - default is small.
    # Resources in this file are reflecting small profile ones.
    #deployment_profile_size: "small"

    # Optional set of custom labels to set on pods of all components of the decision runtime.
    # Label names and values must be strings, not prefixed with "kubernetes.io/" or "ads.ibm.com/"
    labels: {}

    decision_runtime_service:
      # Set the fsGroup  parameter of the security context of the pod for the decision runtime.
      # The default setting doesn't set a value for this parameter, letting the default Kubernetes cluster behavior apply.
      # Note that on OpenShift Container Platform (OCP) and Red Hat OpenShift Kubernetes Service (ROKS), the runAsGroup
      # parameter is set to 0 on these pods.
      #fs_group: 0

      liveness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 18  # Wait 3 minutes (18 × 10s) before restarting
        timeoutSeconds: 7
      startup_probe:
        initialDelaySeconds: 50
        periodSeconds: 10
        failureThreshold: 15  # Max startup time: 200s (50s + 15×10s), actual ~74s
        timeoutSeconds: 7
      readiness_probe:
        initialDelaySeconds: 0  # Start immediately after startup probe succeeds
        periodSeconds: 10
        failureThreshold: 6  # Remove from service after 60s (6×10s) of failures
        timeoutSeconds: 7

      # Number of replica for the service.  Default is one with the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      replica_count: 1
      # This sample shows the default values for the small deployment profile.
      # This setting overrides the default value inherited from the deployment profile.
      resources:
        requests:
          cpu: '500m'
          memory: '2Gi'
          ephemeral_storage: '100Mi'
        limits:
          cpu: '1000m'
          memory: '3Gi'
          ephemeral_storage: '1100Mi'

      # Optional set of custom labels to set on pods of the decision runtime service.
      # Label names and values must be strings, not prefixed with "kubernetes.io/" or "ads.ibm.com/".
      # This set augments the set of custom labels defined at the decision_runtime level.
      labels: {}
      
      # The Horizontal Pod Autoscaling (HPA) of this service is enabled by default only when
      # the deployment profile is set to "extra-large".
      autoscaling:
        # Allows to force status of the HPA independently of the deployment profile.
        #enabled: false
        max_replicas: 2
        min_replicas: 5
        # Default metrics: Target 80% of limit as % of request = 160%
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 160
        # # Aggressive behavior: fast scale up, gradual scale down
        # behavior:
        #   scaleDown:
        #     stabilizationWindowSeconds: 300  # Wait 5 minutes
        #     policies:
        #       - type: Percent
        #         value: 25  # Max 25% reduction
        #         periodSeconds: 120
        #     selectPolicy: Min
        #   scaleUp:
        #     stabilizationWindowSeconds: 0  # Immediate response
        #     policies:
        #       - type: Pods
        #         value: 2  # Add up to 2 pods
        #         periodSeconds: 30
        #       - type: Percent
        #         value: 100  # Or double the pods
        #         periodSeconds: 30
        #     selectPolicy: Max  # Choose the most aggressive

      # Pod Disruption Budget configuration for Decision Runtime service
      pod_disruption_budget:
        # enabled: false  # Defaults to global enable_pdb value - uncomment to override for this service only
        minAvailable: 0  # Set to 0 for small profile (1 replica) to allow pod disruption during maintenance. Set to 1 when replicas >= 2
        unhealthyPodEvictionPolicy: AlwaysAllow
      # Define the pod deployment strategy using the same syntax as in Kubernetes Deployment resource
      # (cf. https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/deployment-v1/#DeploymentSpec)
      strategy:
        type: rollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

      # Configure the cache of decision archives in the decision runtime
      cache:
        config:
          # An XML fragment to configure how decision service archives expire in the cache.
          expiry: ""
          # An XML fragment to configure the maximum size of the decision service archives cache.
          resources: |-
            <heap unit="entries">100</heap>

      # The interval, in milliseconds, between checks and updates of the cached decisions.
      storage_decision_check_status_interval: 30000

      # Configure the cache of decision metadata in the decision runtime
      metadata:
        cache:
          config:
            # Interval in milliseconds between checks/updates of the decision metadata cache.
            check_interval: 30000
            # An XML fragment to configure how metadata expire in the cache. The syntax is identical to cache.config.expiry.
            expiry: ""
            manager:
              # Number of concurrent threads perform metadata cache updates
              threads: 1
            resources: |-
              <heap unit="entries">100</heap>

      # Configure the cache of decision selection results in the decision runtime
      decision_selection:
        cache:
          config:
            expiry: ""
            resources: |-
              <heap unit="entries">100</heap>
        # Interval in milliseconds between the execution of decision selection storage queries in the same thread.
        query_interval: 1000 # 1 second
        # Maximum number of threads that perform updates of the decision selection results cache concurrently.
        threads: 0
        # Interval in milliseconds between decision selection results cache updates.
        update_interval: 120000 # 2 minutes

      # Whether the decision runtime should include an exception stack trace when an incident occurs.
      # This should only be used for debugging purposes, as a stack trace may expose sensitive internal data.
      stack_trace_enabled: false

      tls:
        # Accept self-signed certificates from external services accessed by the runtime like decision storage or ML providers.
        allow_self_signed: false
        # Verify hostnames of certificates received from external services accessed by the runtime
        verify_host_name: true
        # Name of a configmap containing CA certicates to trust when connecting to external services in addition to
        # the certificates from spec.trusted_certificate_list above.
        # Keys must match the '*.crt' pattern.
        certs_config_map_name: ""
