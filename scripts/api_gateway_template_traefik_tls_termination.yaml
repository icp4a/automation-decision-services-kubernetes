apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cncf-platform-login
  namespace: NAMESPACE
spec:
  parentRefs:
  - name: GATEWAY_NAME
    namespace: NAMESPACE
    sectionName: https-cp-console
  hostnames:
  - "HOST"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /login
    backendRefs:
    - name: platform-identity-provider
      port: 4300
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /v1/auth/authorize?client_id=CLIENT_ID&redirect_uri=https://HOST/auth/liberty/callback&response_type=code&scope=openid+email+profile&orig=/login
---
