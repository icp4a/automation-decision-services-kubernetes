apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: GATEWAY_NAME
  namespace: NAMESPACE
spec:
  gatewayClassName: traefik
  listeners:
  - name: https-cp-console
    protocol: HTTPS
    port: 8443
    hostname: "HOST"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: TLS_SECRET
  - name: https-cpd
    protocol: HTTPS
    port: 8443
    hostname: "NAMESPACE-cpd.DOMAIN"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: TLS_SECRET
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: GATEWAY_NAME-licensing
  namespace: LICENSING_NS
spec:
  gatewayClassName: traefik
  listeners:
  - name: https-licensing
    protocol: HTTPS
    port: 8443
    hostname: "licensing.DOMAIN"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: TLS_SECRET
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: platform-auth-service-tls-policy
  namespace: NAMESPACE
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: platform-auth-service
  validation:
    caCertificateRefs:
    - name: cs-ca-certificate-cm
      group: ""
      kind: ConfigMap
    hostname: platform-auth-service
---
