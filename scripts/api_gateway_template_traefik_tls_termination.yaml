apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cncf-social-login-callback
  namespace: NAMESPACE
spec:
  parentRefs:
  - name: GATEWAY_NAME
    namespace: NAMESPACE
    sectionName: https-cp-console
  hostnames:
  - "HOST"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /ibm/api/social-login
    backendRefs:
    - name: platform-auth-service
      port: 9443
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /ibm/api/social-login
---
